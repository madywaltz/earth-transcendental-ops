<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap');
:root{--bg:#05070a;--panel:rgba(8,12,18,.9);--a:#00e5ff;--a2:#ff2d55;--a3:#a855f7;--t:#e8f0ff;--m:#7a8ba3;--ok:#22c55e;--w:#f59e0b;--c:#ef4444;--f:"JetBrains Mono",ui-monospace,monospace;--d:"Orbitron",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--t);font-family:var(--f)}
#c{position:absolute;inset:0}.cesium-viewer-bottom,.cesium-viewer-toolbar,.cesium-viewer-animationContainer,.cesium-viewer-timelineContainer,.cesium-viewer-fullscreenContainer{display:none!important}
.cesium-credit-logoContainer,.cesium-credit-textContainer{opacity:.28;font-size:9px!important}
#hud{position:absolute;inset:0;pointer-events:none;z-index:10}
#tb{pointer-events:auto;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:linear-gradient(180deg,rgba(0,0,0,.82),transparent);border-bottom:1px solid rgba(0,229,255,.1)}
.logo{font-family:var(--d);font-weight:900;font-size:14px;letter-spacing:.16em;background:linear-gradient(90deg,var(--a),var(--a3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo span{opacity:.45;font-weight:500}.sc{display:flex;gap:10px;align-items:center;font-size:11px}
.pill{display:flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:rgba(0,229,255,.07);border:1px solid rgba(0,229,255,.18)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 7px var(--ok);animation:p 2s infinite}@keyframes p{50%{opacity:.35}}
#sb{pointer-events:auto;position:absolute;left:12px;top:56px;bottom:80px;width:280px;display:flex;flex-direction:column;gap:8px;transition:transform .35s cubic-bezier(.22,1,.36,1)}
#sb.hide{transform:translateX(-300px)}
.pn{background:var(--panel);backdrop-filter:blur(16px);border:1px solid rgba(0,229,255,.12);border-radius:11px;overflow:hidden;box-shadow:0 6px 28px rgba(0,0,0,.45)}
.ph{padding:9px 12px;font-size:10px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--a);border-bottom:1px solid rgba(0,229,255,.08)}
.pb{padding:8px 10px;max-height:240px;overflow-y:auto}
.lr{display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:7px;cursor:pointer;font-size:11px;transition:background .12s}
.lr:hover{background:rgba(0,229,255,.06)}.lr.on{background:rgba(0,229,255,.1)}
.sw{width:9px;height:9px;border-radius:2px;flex-shrink:0}.lm{margin-left:auto;font-size:9px;color:var(--m)}
.tg{width:28px;height:16px;border-radius:8px;background:#1a2332;position:relative;flex-shrink:0}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#5a6a80;transition:.18s}
.lr.on .tg{background:rgba(0,229,255,.22)}.lr.on .tg::after{transform:translateX(12px);background:var(--a)}
#bl{flex:1;overflow-y:auto;padding:6px;font-size:10px;line-height:1.4}
.bi{padding:7px 9px;margin-bottom:5px;border-radius:7px;background:rgba(255,255,255,.025);border-left:2px solid var(--a)}
.bi.w{border-left-color:var(--w)}.bi.c{border-left-color:var(--c)}.bi .t{font-weight:600;margin-bottom:1px}.bi .s{color:var(--m);font-size:9px}
#rb{pointer-events:auto;position:absolute;right:12px;top:56px;width:250px;display:flex;flex-direction:column;gap:8px}
#op{display:none}#op.on{display:block}
.ot{font-family:var(--d);font-size:12px;font-weight:700;margin-bottom:6px;color:var(--a)}
.or{display:flex;justify-content:space-between;padding:3px 0;font-size:10px;border-bottom:1px solid rgba(255,255,255,.03)}.or span:first-child{color:var(--m)}
#bb{pointer-events:auto;position:absolute;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;background:linear-gradient(0deg,rgba(0,0,0,.88),transparent)}
.btn{font-family:var(--f);font-size:10px;font-weight:500;letter-spacing:.04em;padding:7px 12px;border-radius:7px;border:1px solid rgba(0,229,255,.22);background:rgba(0,229,255,.07);color:var(--t);cursor:pointer;transition:.15s}
.btn:hover{background:rgba(0,229,255,.16);border-color:var(--a);box-shadow:0 0 14px rgba(0,229,255,.18)}
.btn.p{background:linear-gradient(135deg,rgba(0,229,255,.2),rgba(168,85,247,.2));border-color:var(--a)}.btn.d{border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.08)}
#ck{position:absolute;top:56px;left:50%;transform:translateX(-50%);font-family:var(--d);font-size:11px;letter-spacing:.12em;color:var(--a);text-shadow:0 0 10px rgba(0,229,255,.4);pointer-events:none;opacity:.85}
#cd{position:absolute;bottom:62px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--m);letter-spacing:.05em;pointer-events:none;background:rgba(0,0,0,.4);padding:2px 8px;border-radius:3px}
#ld{position:absolute;inset:0;z-index:100;background:#020406;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .7s,visibility .7s}
#ld.done{opacity:0;visibility:hidden}
.ll{font-family:var(--d);font-weight:900;font-size:22px;letter-spacing:.2em;background:linear-gradient(90deg,#00e5ff,#a855f7,#ff2d55);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:18px;animation:g 2.2s ease-in-out infinite}
@keyframes g{50%{filter:brightness(1.3)}}
.lb{width:190px;height:2px;background:#1a2332;border-radius:1px;overflow:hidden}.lf{height:100%;width:0%;background:linear-gradient(90deg,var(--a),var(--a3));transition:width .25s}
.lm2{margin-top:10px;font-size:10px;color:var(--m);letter-spacing:.06em}
#ts{position:absolute;bottom:88px;left:50%;transform:translateX(-50%) translateY(12px);background:rgba(8,12,18,.94);border:1px solid rgba(0,229,255,.25);padding:8px 14px;border-radius:9px;font-size:11px;opacity:0;transition:.3s;pointer-events:none;z-index:50;max-width:360px;text-align:center}
#ts.on{opacity:1;transform:translateX(-50%) translateY(0)}
#cm{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.96);width:min(460px,92vw);background:rgba(6,10,16,.96);backdrop-filter:blur(20px);border:1px solid rgba(0,229,255,.2);border-radius:12px;opacity:0;visibility:hidden;transition:.18s;z-index:40;pointer-events:auto;box-shadow:0 20px 70px rgba(0,0,0,.6)}
#cm.on{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
#cm input{width:100%;background:transparent;border:none;outline:none;padding:13px 15px;font-family:var(--f);font-size:13px;color:var(--t);border-bottom:1px solid rgba(0,229,255,.08)}
#cr{max-height:240px;overflow-y:auto}.ci{padding:9px 15px;font-size:11px;cursor:pointer;display:flex;gap:8px;align-items:center}.ci:hover{background:rgba(0,229,255,.08)}.ci kbd{margin-left:auto;font-size:9px;color:var(--m);background:rgba(255,255,255,.05);padding:1px 5px;border-radius:3px}
#md{position:absolute;top:56px;left:50%;transform:translateX(-50%);display:flex;gap:3px;pointer-events:auto;z-index:15}
.mod{width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:pointer;background:rgba(0,0,0,.5);border:1px solid rgba(0,229,255,.18);color:var(--m);transition:.15s}
.mod:hover,.mod.on{background:rgba(0,229,255,.12);border-color:var(--a);color:var(--a);box-shadow:0 0 10px rgba(0,229,255,.25)}
#ag{position:absolute;left:12px;bottom:80px;width:7px;height:100px;background:linear-gradient(0deg,#1e3a5f,#0ea5e9,#e0f2fe,#f8fafc);border-radius:3px;border:1px solid rgba(255,255,255,.1);pointer-events:none;opacity:.6}
#am{position:absolute;left:-3px;width:13px;height:2px;background:var(--a);box-shadow:0 0 6px var(--a);border-radius:1px;transition:bottom .25s}
.kh{position:absolute;bottom:14px;right:14px;font-size:9px;color:var(--m);pointer-events:none}.kh kbd{display:inline-block;padding:1px 4px;border-radius:2px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);font-size:8px;margin:0 1px}
.vb{position:absolute;top:12px;right:14px;font-size:8px;letter-spacing:.12em;color:var(--a3);opacity:.65;pointer-events:none}
</style>
</head>
<body>
<div id="ld"><div class="ll">EARTH · TRANSCENDENTAL</div><div class="lb"><div class="lf" id="lf"></div></div><div class="lm2" id="lm">inicializando objeto 3D transcendental…</div></div>

<div id="sb"><div class="pn"><div class="ph">CAMADAS · DOMÍNIOS</div><div class="pb" id="ll"></div></div><div class="pn" style="flex:1;min-height:0;display:flex;flex-direction:column"><div class="ph">BRIEFING AO VIVO</div><div id="bl"></div></div></div>

</div>

<script>

document.getElementById("lm").textContent="Carregando motor completo…";
const V=new Cesium.Viewer("c",{animation:false,timeline:false,baseLayerPicker:false,geocoder:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false,fullscreenButton:false,infoBox:false,terrain:Cesium.Terrain.fromWorldTerrain()});
V.scene.globe.enableLighting=true;V.scene.skyAtmosphere.show=true;
V.camera.setView({destination:Cesium.Cartesian3.fromDegrees(-40,12,2e7)});
document.getElementById("ld").classList.add("done");

// Minimal live: ISS + USGS for demonstration until full script is restored from session artifact
(async()=>{
  try{
    const r=await fetch("https://api.wheretheiss.at/v1/satellites/25544");

    V.entities.add({position:Cesium.Cartesian3.fromDegrees(d.longitude,d.latitude,d.altitude*1000),point:{pixelSize:14,color:Cesium.Color.PURPLE,outlineColor:Cesium.Color.WHITE,outlineWidth:2},label:{text:"ISS",font:"bold 14px sans-serif",fillColor:Cesium.Color.WHITE,pixelOffset:new Cesium.Cartesian2(0,-20)}});

  try{
    const r=await fetch("https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.geojson");
    const j=await r.json();
    (j.features||[]).slice(0,80).forEach(f=>{const [lon,lat]=f.geometry.coordinates;const mag=f.properties.mag||0;

  document.getElementById("lc").textContent="2+ camadas";
  document.getElementById("ec").textContent="live";
})();
